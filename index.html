<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FOX — AI 회의 도우미</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FOX">
<meta name="theme-color" content="#09080d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09080d;
  --sb:#0b0a10;
  --surface:#111019;
  --surface2:#171524;
  --bdr:#1f1c2e;
  --bdr2:#2a2740;
  --text:#f0ecfc;
  --text2:#9b96b8;
  --muted:#504b6a;
  --accent:#8b7cf8;
  --accent-soft:rgba(139,124,248,.12);
  --accent-glow:rgba(139,124,248,.22);
  --fox:#f4882a;
  --fox-soft:rgba(244,136,42,.1);
  --good:#4ade80;
  --good-soft:rgba(74,222,128,.1);
  --err:#f87171;
  --shadow:0 2px 12px rgba(0,0,0,.5);
  --shadow-lg:0 8px 32px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{
  font-family:'DM Sans',system-ui,sans-serif;
  background:var(--sb);
  color:var(--text);
  height:100dvh;
  display:flex;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  font-size:15px;
  line-height:1.6;
}

/* ── SETUP OVERLAY ─────────────────────────────── */
#nameOverlay{
  position:fixed;inset:0;z-index:500;
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  padding:24px;
}
.setup-card{
  width:100%;max-width:360px;
  padding:40px 36px 36px;
  background:var(--surface);
  border:1px solid var(--bdr2);
  border-radius:24px;
  box-shadow:var(--shadow-lg),0 0 0 1px rgba(139,124,248,.06);
}
.setup-fox{
  font-family:'DM Serif Display',Georgia,serif;
  font-style:italic;
  font-size:42px;
  color:var(--fox);
  line-height:1;
  margin-bottom:4px;
  letter-spacing:-.02em;
}
.setup-fox span{font-size:28px;margin-right:6px;font-style:normal}
.setup-h{
  font-family:'DM Serif Display',Georgia,serif;
  font-size:20px;
  font-weight:400;
  color:var(--text);
  margin-bottom:6px;
  letter-spacing:-.02em;
}
.setup-sub{font-size:13px;color:var(--muted);line-height:1.65;margin-bottom:24px}
.setup-field-lbl{
  font-size:11px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);
  margin-bottom:7px;
}
.setup-inp{
  width:100%;padding:11px 14px;
  border:1.5px solid var(--bdr2);
  border-radius:10px;
  font-family:'DM Sans',sans-serif;
  font-size:15px;color:var(--text);
  background:var(--bg);outline:none;
  margin-bottom:20px;
  transition:border-color .18s,box-shadow .18s;
}
.setup-inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.setup-inp::placeholder{color:var(--muted)}
.lang-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:24px}
.lang-chip{
  padding:6px 14px;
  border:1.5px solid var(--bdr2);
  border-radius:20px;
  font-size:12px;font-weight:500;
  color:var(--text2);
  cursor:pointer;background:transparent;
  transition:all .15s;touch-action:manipulation;
}
.lang-chip:hover{border-color:var(--accent);color:var(--text)}
.lang-chip.on{border-color:var(--accent);color:#fff;background:var(--accent)}
.setup-btn{
  width:100%;padding:13px;
  background:var(--accent);
  color:#fff;border:none;
  border-radius:10px;
  font-family:'DM Sans',sans-serif;
  font-size:14px;font-weight:600;
  letter-spacing:.01em;
  cursor:pointer;touch-action:manipulation;
  transition:opacity .15s,transform .12s;
}
.setup-btn:hover{opacity:.9}
.setup-btn:active{transform:scale(.98)}

/* ── SIDEBAR ───────────────────────────────────── */
.sb{
  width:232px;flex-shrink:0;
  background:var(--sb);
  border-right:1px solid var(--bdr);
  display:flex;flex-direction:column;
  overflow:hidden;
  transition:transform .24s cubic-bezier(.4,0,.2,1);
}
.sb-head{
  padding:16px 14px 12px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--bdr);
  flex-shrink:0;
}
.logo{
  display:flex;align-items:center;gap:10px;
  cursor:pointer;background:none;border:none;padding:0;min-width:0;
}
.logo-icon{
  font-size:20px;flex-shrink:0;
  width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;
}
.logo-text{
  display:flex;flex-direction:column;line-height:1;
}
.logo-fox{
  font-family:'DM Serif Display',Georgia,serif;
  font-style:italic;
  font-size:18px;
  font-weight:400;
  color:var(--fox);
  letter-spacing:-.01em;
}
.logo-sub{
  font-size:9px;font-weight:500;
  letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);margin-top:2px;
}
.new-btn{
  position:relative;
  width:26px;height:26px;
  border-radius:7px;
  background:transparent;
  border:1px solid var(--bdr);
  color:var(--muted);
  font-size:16px;line-height:1;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;touch-action:manipulation;flex-shrink:0;
}
.new-btn:hover{background:var(--surface);border-color:var(--accent);color:var(--text)}
.tip{
  position:absolute;left:calc(100% + 8px);top:50%;
  transform:translateY(-50%);
  background:var(--text);color:var(--bg);
  font-size:10px;font-weight:600;
  letter-spacing:.04em;padding:4px 8px;
  border-radius:5px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .14s;z-index:200;
}
.new-btn:hover .tip{opacity:1}
.sb-section{
  font-size:10px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);
  padding:12px 16px 6px;flex-shrink:0;
}
.sess-list{flex:1;overflow-y:auto;padding:2px 8px 8px}
.sess-list::-webkit-scrollbar{width:3px}
.sess-list::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:2px}
.sess-empty{
  padding:16px 8px;
  font-size:12px;color:var(--muted);line-height:1.6;
}
.sess-row{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;border-radius:8px;
  cursor:pointer;touch-action:manipulation;
  margin-bottom:2px;
  transition:background .12s;
}
.sess-row:hover{background:var(--surface)}
.sess-row.on{background:var(--surface2);border-left:2px solid var(--accent);padding-left:8px}
.sess-pip{
  width:5px;height:5px;border-radius:50%;
  background:var(--muted);flex-shrink:0;
  transition:background .15s;
}
.sess-row:hover .sess-pip{background:var(--text2)}
.sess-row.on .sess-pip{background:var(--accent)}
.sess-row.done .sess-pip{background:var(--good)}
.sess-info{flex:1;min-width:0}
.sess-title{
  font-size:12px;font-weight:500;
  color:var(--text2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sess-row.on .sess-title,.sess-row:hover .sess-title{color:var(--text)}
.sess-meta{font-size:10px;color:var(--muted);margin-top:2px}
.del-btn{
  width:20px;height:20px;border-radius:5px;
  border:none;background:none;color:var(--muted);
  font-size:14px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  opacity:0;flex-shrink:0;
  transition:opacity .1s,background .1s,color .1s;
}
.sess-row:hover .del-btn{opacity:1}
.del-btn:hover{background:rgba(248,113,113,.15);color:var(--err)}
.sb-foot{
  padding:10px 12px 12px;
  border-top:1px solid var(--bdr);
  display:flex;align-items:center;gap:10px;
  flex-shrink:0;cursor:pointer;
  transition:background .12s;
}
.sb-foot:hover{background:var(--surface)}
.foot-av{
  width:32px;height:32px;border-radius:50%;
  background:var(--surface2);border:1.5px solid var(--bdr2);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;
}
.foot-name{
  font-size:12px;font-weight:600;color:var(--text2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.foot-tag{font-size:10px;color:var(--muted);margin-top:2px}

/* ── MAIN ──────────────────────────────────────── */
.main{
  flex:1;min-width:0;
  display:flex;flex-direction:column;
  background:var(--bg);overflow:hidden;
}
.topbar{
  background:rgba(9,8,13,.85);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--bdr);
  padding:8px 20px;
  display:flex;align-items:center;gap:10px;
  flex-shrink:0;min-height:48px;
}
.menu-btn{
  background:none;border:none;color:var(--muted);
  font-size:17px;cursor:pointer;padding:5px;
  border-radius:6px;display:none;touch-action:manipulation;
  transition:color .12s;
}
.menu-btn:hover{color:var(--text)}
.tb-title{
  font-family:'DM Sans',sans-serif;
  font-size:13px;font-weight:500;
  color:var(--text2);
  flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.lang-wrap{position:relative}
.lang-btn{
  padding:5px 10px;
  border:1px solid var(--bdr2);
  border-radius:6px;
  font-size:11px;font-weight:500;
  letter-spacing:.03em;
  background:none;color:var(--muted);
  cursor:pointer;white-space:nowrap;
  touch-action:manipulation;
  transition:color .12s,border-color .12s;
}
.lang-btn:hover{color:var(--text);border-color:var(--muted)}
.lang-drop{
  position:absolute;top:calc(100% + 6px);right:0;
  background:var(--surface2);
  border:1px solid var(--bdr2);
  border-radius:10px;overflow:hidden;
  z-index:300;min-width:130px;
  box-shadow:var(--shadow-lg);
}
.lang-drop-item{
  padding:9px 14px;
  font-size:12px;font-weight:500;
  color:var(--text2);cursor:pointer;
  transition:background .1s;
  display:flex;align-items:center;gap:8px;
}
.lang-drop-item:hover{background:var(--surface)}
.lang-drop-item.on{color:var(--accent)}
.end-btn{
  font-size:11px;font-weight:600;
  letter-spacing:.04em;text-transform:uppercase;
  background:none;
  border:1px solid var(--bdr2);
  color:var(--muted);
  padding:6px 12px;border-radius:6px;
  cursor:pointer;white-space:nowrap;
  touch-action:manipulation;
  transition:color .12s,border-color .12s,background .12s;
}
.end-btn:hover{color:var(--text);border-color:var(--muted);background:var(--surface)}
.end-btn:disabled{opacity:.35;cursor:not-allowed}

/* ── WELCOME ───────────────────────────────────── */
#welcome{
  flex:1;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:0 32px 32px;
  text-align:center;
  transition:opacity .22s ease;
}
#welcome.hiding{opacity:0;pointer-events:none}
.w-greeting{
  font-family:'DM Serif Display',Georgia,serif;
  font-size:32px;font-weight:400;
  color:var(--text);
  line-height:1.3;
  margin-bottom:6px;
  letter-spacing:-.02em;
  text-wrap:balance;
}
.w-greeting em{font-style:italic;color:var(--accent)}
.w-sub{
  font-size:14px;color:var(--muted);
  line-height:1.6;margin-bottom:36px;
}
.mtg-type-lbl{display:none}
.mtg-grid{
  display:flex;flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  max-width:440px;width:100%;
  margin-bottom:0;
}
.mtg-card{
  display:inline-flex;align-items:center;gap:7px;
  padding:10px 18px;
  background:var(--surface);
  border:1px solid var(--bdr);
  border-radius:24px;
  cursor:pointer;touch-action:manipulation;
  transition:border-color .16s,background .16s,color .16s,transform .12s;
  white-space:nowrap;
}
.mtg-card:hover{border-color:var(--bdr2);background:var(--surface2);transform:translateY(-1px)}
.mtg-card:active{transform:scale(.97)}
.mtg-icon{font-size:15px;line-height:1}
.mtg-label{font-size:13px;font-weight:500;color:var(--text2);line-height:1}
.mtg-card:hover .mtg-label{color:var(--text)}

/* ── CHAT ──────────────────────────────────────── */
#chat{
  flex:1;overflow-y:auto;
  padding:24px 24px 12px;
  -webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;gap:4px;
  opacity:0;transition:opacity .24s ease;
}
#chat.visible{opacity:1}
#chat::-webkit-scrollbar{width:4px}
#chat::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:2px}
.mtg-badge-wrap{display:flex;justify-content:center;padding:8px 0 16px}
.mtg-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--surface);
  border:1px solid var(--bdr);
  border-radius:20px;
  padding:5px 14px;
  font-size:11px;font-weight:500;
  color:var(--muted);letter-spacing:.02em;
}
.msg-row{display:flex;gap:10px;margin-bottom:10px}
.msg-row.u{flex-direction:row-reverse}
.av{
  width:30px;height:30px;border-radius:50%;
  flex-shrink:0;margin-top:2px;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;
  background:var(--surface2);
  border:1px solid var(--bdr2);
}
.av.u{
  background:linear-gradient(135deg,var(--accent),#6d54f0);
  border-color:transparent;
  font-size:13px;
}
.bubble{
  max-width:min(70%,520px);
  padding:11px 15px;
  font-size:14px;line-height:1.75;
  word-break:break-word;white-space:pre-wrap;
}
.bubble.ai{
  background:var(--surface);
  color:var(--text);
  border:1px solid var(--bdr);
  border-left:2px solid var(--accent);
  border-radius:2px 12px 12px 12px;
}
.bubble.u{
  background:linear-gradient(135deg,var(--accent),#6d54f0);
  color:#fff;
  border-radius:12px 2px 12px 12px;
}
.think-row{display:flex;gap:10px;margin-bottom:10px}
.think-bbl{
  background:var(--surface);
  border:1px solid var(--bdr);
  border-left:2px solid var(--accent);
  border-radius:2px 12px 12px 12px;
  padding:13px 18px;
  display:flex;gap:6px;align-items:center;
}
.dot{
  width:5px;height:5px;border-radius:50%;
  background:var(--accent);opacity:.25;
  animation:pulse 1.3s ease-in-out infinite;
}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes pulse{40%{opacity:.9;transform:scale(1.4)}}
.sum-card{
  background:var(--surface);
  border:1px solid var(--bdr2);
  border-radius:14px;
  overflow:hidden;
  margin:12px 0 4px;
}
.sum-head{
  background:linear-gradient(90deg,var(--accent),#6d54f0);
  padding:10px 18px;
  font-size:11px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;
  color:#fff;
}
.sum-body{
  padding:18px;
  font-size:13.5px;line-height:1.85;
  color:var(--text2);
  white-space:pre-wrap;word-break:break-word;
}

/* ── INPUT BAR ─────────────────────────────────── */
.ibar{
  padding:10px 16px 16px;
  background:var(--bg);
  border-top:1px solid var(--bdr);
  display:flex;gap:8px;align-items:flex-end;
  flex-shrink:0;
}
#inp{
  flex:1;padding:11px 16px;
  border:1.5px solid var(--bdr2);
  border-radius:12px;
  font-family:'DM Sans',sans-serif;
  font-size:14px;line-height:1.6;
  color:var(--text);background:var(--surface);
  outline:none;resize:none;
  overflow:hidden;height:44px;max-height:140px;
  transition:border-color .18s,box-shadow .18s;
}
#inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#inp::placeholder{color:var(--muted)}
#inp:disabled{opacity:.4}
.send-btn{
  width:42px;height:42px;
  border-radius:12px;flex-shrink:0;
  background:var(--accent);
  border:none;color:#fff;
  font-size:17px;line-height:1;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .14s,transform .12s,box-shadow .18s;
  touch-action:manipulation;
  box-shadow:0 3px 14px var(--accent-glow);
}
.send-btn:hover{opacity:.9;box-shadow:0 5px 20px var(--accent-glow)}
.send-btn:active{transform:scale(.9)}
.send-btn:disabled{opacity:.3;cursor:not-allowed;transform:none;box-shadow:none}

/* ── OVERLAY & RESPONSIVE ──────────────────────── */
.overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(2px);
  z-index:90;
}
.overlay.show{display:block}
@media(max-width:640px){
  .sb{
    position:fixed;left:0;top:0;bottom:0;
    z-index:100;transform:translateX(-100%);
  }
  .sb.open{transform:none}
  .menu-btn{display:flex}
  .w-greeting{font-size:24px}
  .mtg-grid{max-width:320px}
}
@media(prefers-reduced-motion:reduce){
  .sb,.dot,#inp,.mtg-card::before{transition:none;animation:none}
}
</style>
</head>
<body>

<div id="nameOverlay" hidden>
  <div class="setup-card">
    <div class="setup-fox"><span>🦊</span>FOX</div>
    <div class="setup-h">AI 회의 도우미입니다</div>
    <div class="setup-sub">이름을 알려주세요. 더 나은 회의를 함께 이끌어갈게요.</div>
    <div class="setup-field-lbl">이름</div>
    <input id="nameInput" class="setup-inp" type="text" placeholder="이름 입력" maxlength="20" autocomplete="off">
    <div class="setup-field-lbl">언어</div>
    <div class="lang-chips" id="setupLangChips">
      <div class="lang-chip on" data-lang="ko" onclick="selectSetupLang(this)">한국어</div>
      <div class="lang-chip" data-lang="en" onclick="selectSetupLang(this)">English</div>
      <div class="lang-chip" data-lang="ja" onclick="selectSetupLang(this)">日本語</div>
      <div class="lang-chip" data-lang="zh" onclick="selectSetupLang(this)">中文</div>
    </div>
    <button class="setup-btn" id="setupBtn" onclick="confirmSetup()">시작하기 →</button>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeSb()"></div>

<nav class="sb" id="sb">
  <div class="sb-head">
    <button class="logo" onclick="goHome()">
      <div class="logo-icon">🦊</div>
      <div class="logo-text">
        <span class="logo-fox">FOX</span>
        <span class="logo-sub" id="logoTag">AI 회의 도우미</span>
      </div>
    </button>
    <button class="new-btn" onclick="goHome()">+<span class="tip">새 회의 시작</span></button>
  </div>
  <div class="sb-section">회의 목록</div>
  <div class="sess-list" id="sessList"></div>
  <div class="sb-foot" onclick="editSetup()">
    <div class="foot-av" id="footAv"></div>
    <div style="flex:1;min-width:0">
      <div class="foot-name" id="footName"></div>
      <div class="foot-tag" id="footSub"></div>
    </div>
  </div>
</nav>

<div class="main">
  <div class="topbar">
    <button class="menu-btn" onclick="toggleSb()">☰</button>
    <div class="tb-title" id="tbTitle">FOX — AI 회의 도우미</div>
    <div class="lang-wrap">
      <button class="lang-btn" id="langBtn" onclick="toggleLangDrop()">한국어</button>
      <div class="lang-drop" id="langDrop" hidden>
        <div class="lang-drop-item on" data-lang="ko" onclick="setLang('ko')">🇰🇷 한국어</div>
        <div class="lang-drop-item" data-lang="en" onclick="setLang('en')">🇺🇸 English</div>
        <div class="lang-drop-item" data-lang="ja" onclick="setLang('ja')">🇯🇵 日本語</div>
        <div class="lang-drop-item" data-lang="zh" onclick="setLang('zh')">🇨🇳 中文</div>
      </div>
    </div>
    <button class="end-btn" id="endBtn" onclick="endMeeting()" hidden>회의 종료</button>
  </div>

  <div id="welcome">

const LANG_LABELS = {ko:'한국어',en:'English',ja:'日本語',zh:'中文'};
const LANG_CFG = {
  ko:{tag:'AI 회의 도우미',sub:'회의 유형을 선택하거나 직접 입력하세요',typeLabel:'회의 유형 선택',startBtn:'회의 시작 →',endBtn:'회의 종료',placeholder:'회의 주제나 안건을 입력하세요…',chatPH:'메시지를 입력하세요 (Enter 전송)',endedPH:'이 회의는 종료되었습니다',sumHead:'📋 회의록 & 결정사항',

  ja:{tag:'AI会議アシスタント',sub:'タイプを選択するかトピックを入力',typeLabel:'会議タイプを選択',startBtn:'会議を始める →',endBtn:'会議を終了',placeholder:'会議のテーマや議題を入力…',chatPH:'メッセージを入力 (Enterで送信)',endedPH:'この会議は終了しました',sumHead:'📋 議事録と決定事項',

  zh:{tag:'AI会议助理',sub:'选择类型或输入主题',typeLabel:'选择会议类型',startBtn:'开始会议 →',endBtn:'结束会议',placeholder:'输入会议主题或议程…',chatPH:'输入消息 (Enter发送)',endedPH:'会议已结束',sumHead:'📋 会议纪要与决定事项',
    sumPrompt:'请总结会议:\n\n## 📋 会议摘要\n主要讨论内容（3-5条）\n\n## ✅ 决定事项\n\n## 📌 行动事项\n含负责人和截止日期\n\n## 📅 下一步\n\n简明扼要。'},

let state={name:'',animal:'',lang:'ko',sessions:[],active:null};
let ctrl=null,busy=false,viewMode='home',setupLang='ko',selType=MTG_TYPES[0];

function save(){try{localStorage.setItem('fox_v1',JSON.stringify(state));}catch{}}
function load(){try{const d=localStorage.getItem('fox_v1');if(d)state={...state,...JSON.parse(d)};}catch{}}
const mkId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmtDate=ts=>new Date(ts).toLocaleDateString('ko-KR',{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'});
const getSess=id=>state.sessions.find(s=>s.id===id);
const typeLabel=t=>{const l=state.lang||'ko';return l==='ko'?t.ko:l==='en'?t.en:l==='ja'?t.ja:t.zh;};
function pickAnimal(n){let h=0;for(let i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))>>>0;return ANIMALS[h%ANIMALS.length];}

async function callWorker(messages, userName, lang, onText, signal) {
  const msgs = messages.filter(m => m.role !== 'system').map(m => ({
    role: m.role === 'user' ? 'user' : 'assistant',
    content: m.content,
  }));
  const res = await fetch(`${WORKER}/api/chat`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages: msgs, mode: 'meeting', lang, userName }),
    signal,
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || `HTTP ${res.status}`);
  }
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '', accumulated = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split('\n');
    buf = lines.pop() || '';
    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      const data = line.slice(6).trim();
      if (data === '[DONE]') continue;
      try {
        const j = JSON.parse(data);
        if (j.type === 'content_block_delta' && j.delta?.type === 'text_delta') {
          accumulated += j.delta.text;
          onText({ text: accumulated });
        }
      } catch {}
    }
  }
  return accumulated;
}

load();
boot();

function boot(){
  if(!state.name){document.getElementById('nameOverlay').hidden=false;document.getElementById('nameInput').focus();return;}
  applyProfile();goHome();
}

function applyProfile(){
  if(!state.animal)state.animal=pickAnimal(state.name);
  const lang=state.lang||'ko';const cfg=LANG_CFG[lang];
  document.getElementById('logoTag').textContent=cfg.tag;
  document.getElementById('footAv').textContent=state.animal;
  document.getElementById('footName').textContent=state.name;
  document.getElementById('footSub').textContent=(ANIMAL_NAMES[state.animal]||'')+'  ·  '+LANG_LABELS[lang];
  document.getElementById('wUserName').textContent=state.name;
  document.getElementById('wSub').textContent=cfg.sub;
  document.getElementById('endBtn').textContent=cfg.endBtn;
  document.getElementById('langBtn').textContent=LANG_LABELS[lang];
  document.querySelectorAll('#langDrop .lang-drop-item').forEach(el=>el.classList.toggle('on',el.dataset.lang===lang));
  renderMtgGrid();
}

function renderMtgGrid(){
  const grid=document.getElementById('mtgGrid');
  grid.innerHTML=MTG_TYPES.map(t=>`<div class="mtg-card" onclick="pickAndStart('${t.id}')"><div class="mtg-icon">${t.icon}</div><div class="mtg-label">${typeLabel(t)}</div></div>`).join('');
}

function pickAndStart(id){
  selType=MTG_TYPES.find(t=>t.id===id)||MTG_TYPES[0];
  const s=createSession(typeLabel(selType),selType);
  autoStartMeeting(s);
}
function selectSetupLang(el){setupLang=el.dataset.lang;document.querySelectorAll('#setupLangChips .lang-chip').forEach(c=>c.classList.remove('on'));el.classList.add('on');}

function confirmSetup(){
  const v=document.getElementById('nameInput').value.trim();
  if(!v){document.getElementById('nameInput').focus();return;}
  state.name=v;state.animal=pickAnimal(v);state.lang=setupLang;
  save();document.getElementById('nameOverlay').hidden=true;applyProfile();goHome();
}

function editSetup(){
  setupLang=state.lang||'ko';
  document.querySelectorAll('#setupLangChips .lang-chip').forEach(c=>c.classList.toggle('on',c.dataset.lang===setupLang));
  document.getElementById('nameInput').value=state.name;
  document.getElementById('nameOverlay').hidden=false;
  requestAnimationFrame(()=>{const i=document.getElementById('nameInput');i.focus();i.select();});
}

function toggleLangDrop(){document.getElementById('langDrop').hidden=!document.getElementById('langDrop').hidden;}
function setLang(l){state.lang=l;save();document.getElementById('langDrop').hidden=true;applyProfile();}
document.addEventListener('click',e=>{if(!e.target.closest('.lang-wrap'))document.getElementById('langDrop').hidden=true;});

function goHome(){
  ctrl?.abort();ctrl=null;busy=false;
  viewMode='home';state.active=null;closeSb();
  document.getElementById('welcome').hidden=false;
  document.getElementById('welcome').classList.remove('hiding');
  document.getElementById('chat').hidden=true;
  document.getElementById('chat').classList.remove('visible');
  document.getElementById('endBtn').hidden=true;
  document.getElementById('tbTitle').textContent='FOX — AI 회의 도우미';
  document.getElementById('inp').placeholder=LANG_CFG[state.lang||'ko'].placeholder;
  document.getElementById('inp').disabled=false;
  document.getElementById('sendBtn').disabled=false;
  renderList();
}

async function autoStartMeeting(s){
  const mt=MTG_TYPES.find(t=>t.id===s.mtgType)||MTG_TYPES[MTG_TYPES.length-1];
  const lang=state.lang||'ko';
  const openMsg=(MTG_OPEN[mt.id]||MTG_OPEN.other)[lang]||(MTG_OPEN[mt.id]||MTG_OPEN.other).ko;
  s.turns.push({role:'_auto',content:openMsg});save();
  const chat=document.getElementById('chat');
  const trow=appendThinking(chat);
  setBusy(true);ctrl=new AbortController();
  let bbl=null,streamed='';
  try{
    const msgs=s.turns.filter(t=>t.role!=='_sum'&&t.role!=='_auto').concat([{role:'user',content:openMsg}]);
    streamed=await callWorker(msgs,state.name,lang,
      ({text:t})=>{streamed=t;if(!bbl){trow.remove();bbl=appendBubble(chat,'ai','');}bbl.textContent=t;scrollBottom();},
      ctrl.signal
    );
    trow.remove();
    s.turns.push({role:'assistant',content:streamed});save();
  }catch(e){
    trow.remove();
    if(e.name!=='AbortError')appendBubble(chat,'ai','오류가 발생했습니다. 다시 시도해주세요.');
  }finally{setBusy(false);scrollBottom();renderList();}
}

function createSession(topic,mt){
  const id=mkId();
  const s={id,title:topic.slice(0,28)+(topic.length>28?'…':''),mtgType:mt.id,turns:[],ended:false,createdAt:Date.now()};
  state.sessions.unshift(s);save();
  transitionToChat(s);return s;
}

function transitionToChat(s){showChat(s);}

function showChat(s){
  const fromHome=viewMode==='home';
  viewMode='chat';state.active=s.id;save();
  const welcome=document.getElementById('welcome');
  const chat=document.getElementById('chat');
  const mt=MTG_TYPES.find(t=>t.id===s.mtgType)||MTG_TYPES[0];

  // 콘텐츠 빌드
  chat.innerHTML='';
  const badge=document.createElement('div');badge.className='mtg-badge-wrap';
  badge.innerHTML=`<div class="mtg-badge">${mt.icon} ${esc(typeLabel(mt))} · ${esc(fmtDate(s.createdAt))}</div>`;
  chat.appendChild(badge);
  s.turns.forEach(t=>{
    if(t.role==='_sum')appendSum(chat,t.content);
    else if(t.role==='user')appendBubble(chat,'u',t.content);
    else if(t.role==='assistant')appendBubble(chat,'ai',t.content);
  });

  const cfg=LANG_CFG[state.lang||'ko'];
  document.getElementById('tbTitle').textContent=s.title;
  document.getElementById('endBtn').hidden=s.ended;
  document.getElementById('inp').disabled=s.ended;
  document.getElementById('inp').placeholder=s.ended?cfg.endedPH:cfg.chatPH;
  document.getElementById('sendBtn').disabled=s.ended;

  if(fromHome){
    // 홈→채팅: 페이드 트랜지션
    welcome.classList.add('hiding');
    chat.hidden=false;chat.classList.remove('visible');
    chat.offsetHeight;
    requestAnimationFrame(()=>{chat.classList.add('visible');});
    setTimeout(()=>{welcome.hidden=true;welcome.classList.remove('hiding');},240);
  } else {
    // 채팅→채팅: 즉시 전환
    chat.hidden=false;chat.classList.add('visible');
  }
  scrollBottom();renderList();
}

function pick(id){if(id!==state.active){ctrl?.abort();ctrl=null;busy=false;}const s=getSess(id);if(!s)return;closeSb();showChat(s);}

function renderList(){
  const el=document.getElementById('sessList');
  if(!state.sessions.length){el.innerHTML='<div class="sess-empty">아직 회의가 없습니다.<br>새 회의를 시작해보세요.</div>';return;}
  el.innerHTML=state.sessions.map(s=>{
    const mt=MTG_TYPES.find(t=>t.id===s.mtgType)||MTG_TYPES[0];
    const cnt=s.turns.filter(t=>t.role==='user').length;
    const meta=s.ended?'종료됨 ✓':(cnt>0?cnt+'개 발언':'대기 중');
    const isOn=s.id===state.active&&viewMode==='chat';
    const cls=['sess-row',isOn&&'on',s.ended&&'done'].filter(Boolean).join(' ');
    return `<div class="${cls}" onclick="pick('${s.id}')"><div class="sess-pip"></div><div class="sess-info"><div class="sess-title">${mt.icon} ${esc(s.title)}</div><div class="sess-meta">${esc(meta)}</div></div><button class="del-btn" onclick="event.stopPropagation();delSess('${s.id}')">×</button></div>`;
  }).join('');
}

function appendBubble(chat,type,text){
  const row=document.createElement('div');row.className='msg-row'+(type==='u'?' u':'');
  const av=type==='u'?(state.animal||'🙂'):AI_ANIMAL;
  row.innerHTML=`<div class="av${type==='u'?' u':''}">${av}</div><div class="bubble ${type}"></div>`;
  row.querySelector('.bubble').textContent=text;chat.appendChild(row);return row.querySelector('.bubble');
}
function appendThinking(chat){
  const r=document.createElement('div');r.className='think-row';r.id='trow';
  r.innerHTML=`<div class="av">${AI_ANIMAL}</div><div class="think-bbl"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
  chat.appendChild(r);scrollBottom();return r;
}
function appendSum(chat,text){
  const cfg=LANG_CFG[state.lang||'ko'];
  const c=document.createElement('div');c.className='sum-card';
  c.innerHTML=`<div class="sum-head">${esc(cfg.sumHead)}</div><div class="sum-body"></div>`;
  c.querySelector('.sum-body').textContent=text;chat.appendChild(c);
}
function scrollBottom(){const c=document.getElementById('chat');requestAnimationFrame(()=>{c.scrollTop=c.scrollHeight;});}

async function send(){
  if(busy)return;
  const inp=document.getElementById('inp');const text=inp.value.trim();if(!text)return;
  inp.value='';growInp(inp);
  let s=getSess(state.active);
  const isNew=viewMode==='home'||!s;
  if(isNew)s=createSession(text,selType);
  s.turns.push({role:'user',content:text});save();
  const chat=document.getElementById('chat');
  appendBubble(chat,'u',text);
  const trow=appendThinking(chat);
  setBusy(true);ctrl=new AbortController();
  let bbl=null,streamed='';
  try{
    streamed=await callWorker(
      s.turns.filter(t=>t.role!=='_sum'&&t.role!=='_auto'),
      state.name, state.lang||'ko',
      ({text:t})=>{streamed=t;if(!bbl){trow.remove();bbl=appendBubble(chat,'ai','');}bbl.textContent=t;scrollBottom();},
      ctrl.signal
    );
    trow.remove();
    s.turns.push({role:'assistant',content:streamed});save();
  }catch(e){
    trow.remove();
    if(e.name!=='AbortError')appendBubble(chat,'ai','오류가 발생했습니다. 다시 시도해주세요.');
  }finally{setBusy(false);scrollBottom();renderList();}
}

async function endMeeting(){
  if(busy)return;const s=getSess(state.active);if(!s||s.ended)return;
  document.getElementById('endBtn').disabled=true;
  const chat=document.getElementById('chat');const trow=appendThinking(chat);
  setBusy(true);ctrl=new AbortController();
  const cfg=LANG_CFG[state.lang||'ko'];
  const msgs=[...s.turns.filter(t=>t.role!=='_sum'&&t.role!=='_auto'),{role:'user',content:cfg.sumPrompt}];
  let bbl=null,streamed='';
  try{
    streamed=await callWorker(
      msgs, state.name, state.lang||'ko',
      ({text:t})=>{streamed=t;if(!bbl){trow.remove();bbl=appendBubble(chat,'ai','');}bbl.textContent=t;scrollBottom();},
      ctrl.signal
    );
    trow.remove();
    if(bbl)bbl.closest('.msg-row')?.remove();
    s.turns.push({role:'_sum',content:streamed});s.ended=true;save();
    appendSum(chat,streamed);
    document.getElementById('endBtn').hidden=true;
    document.getElementById('inp').disabled=true;
    document.getElementById('inp').placeholder=cfg.endedPH;
    document.getElementById('sendBtn').disabled=true;
    renderList();scrollBottom();
  }catch(e){
    trow.remove();
    if(e.name!=='AbortError')appendBubble(chat,'ai','요약 생성 중 오류가 발생했습니다.');
    document.getElementById('endBtn').disabled=false;
  }finally{setBusy(false);}
}

function delSess(id){if(id===state.active)ctrl?.abort();state.sessions=state.sessions.filter(s=>s.id!==id);if(state.active===id)goHome();else{save();renderList();}}
function setBusy(v){busy=v;const s=getSess(state.active);if(!s?.ended){document.getElementById('inp').disabled=v;document.getElementById('sendBtn').disabled=v;}}
function onKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}
function growInp(el){el.style.height='auto';const h=Math.min(el.scrollHeight,140);el.style.height=h+'px';el.style.overflowY=el.scrollHeight>140?'auto':'hidden';}
function toggleSb(){document.getElementById('sb').classList.toggle('open');document.getElementById('overlay').classList.toggle('show');}
function closeSb(){document.getElementById('sb').classList.remove('open');document.getElementById('overlay').classList.remove('show');}
document.getElementById('nameInput').addEventListener('keydown',e=>{if(e.key==='Enter')confirmSetup();});

// PWA
(function(){
  function makeIcon(sz){
    const c=document.createElement('canvas');c.width=c.height=sz;
    const ctx=c.getContext('2d');
    const g=ctx.createLinearGradient(0,0,sz,sz);
    g.addColorStop(0,'#17132a');g.addColorStop(1,'#0d0b18');
    ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(0,0,sz,sz,sz*.22);ctx.fill();
    ctx.font=`italic bold ${sz*.38}px 'DM Serif Display',Georgia,serif`;
    ctx.fillStyle='#f4882a';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('FOX',sz/2,sz/2);return c.toDataURL('image/png');
  }
  setTimeout(()=>{
    const i192=makeIcon(192),i512=makeIcon(512);
    const m={name:'FOX',short_name:'FOX',description:'AI Meeting Assistant',start_url:'./',display:'standalone',background_color:'#09080d',theme_color:'#09080d',icons:[{src:i192,sizes:'192x192',type:'image/png'},{src:i512,sizes:'512x512',type:'image/png',purpose:'any maskable'}]};
    const blob=new Blob([JSON.stringify(m)],{type:'application/manifest+json'});
    const lnk=document.createElement('link');lnk.rel='manifest';lnk.href=URL.createObjectURL(blob);document.head.appendChild(lnk);
    const al=document.createElement('link');al.rel='apple-touch-icon';al.href=i192;document.head.appendChild(al);
  },500);
  let dp=null;
  window.addEventListener('beforeinstallprompt',e=>{
    e.preventDefault();dp=e;
    const btn=document.createElement('button');
    btn.textContent='홈 화면에 추가';
    btn.style.cssText='position:fixed;bottom:80px;right:16px;z-index:999;background:#8b7cf8;color:#fff;border:none;padding:9px 16px;border-radius:10px;font-family:"DM Sans",sans-serif;font-size:12px;font-weight:600;cursor:pointer;box-shadow:0 4px 20px rgba(139,124,248,.4);';
    btn.onclick=()=>{btn.remove();dp.prompt();dp=null;};
    document.body.appendChild(btn);setTimeout(()=>btn.remove(),12000);
  });
})();
</script>
